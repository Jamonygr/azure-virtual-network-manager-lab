<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">Create-test-destroy lifecycle</title>
  <desc id="desc">Preflight and static tests lead to hub-spoke apply and smoke tests, mesh transition and smoke tests, then a guaranteed finally block undeploys the AVNM goal state and destroys the lab.</desc>
  <defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#2563eb;stroke-width:2}.test{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.cleanup{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.ok{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.title{font:700 21px Segoe UI,Arial;fill:#10233f}.head{font:700 14px Segoe UI,Arial;fill:#10233f}.text{font:12px Segoe UI,Arial;fill:#475569}.line{stroke:#64748b;stroke-width:2.5;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1180" height="360" rx="16"/><text class="title" x="30" y="40">One command, bounded convergence, guaranteed cleanup</text>
  <rect class="box" x="25" y="85" width="145" height="100" rx="10"/><text class="head" x="98" y="116" text-anchor="middle">Preflight</text><text class="text" x="98" y="140" text-anchor="middle">tools · Azure</text><text class="text" x="98" y="159" text-anchor="middle">providers · scope</text>
  <rect class="test" x="195" y="85" width="145" height="100" rx="10"/><text class="head" x="268" y="116" text-anchor="middle">Static tests</text><text class="text" x="268" y="140" text-anchor="middle">Terraform · Pester</text><text class="text" x="268" y="159" text-anchor="middle">Go contracts</text>
  <rect class="box" x="365" y="85" width="145" height="100" rx="10"/><text class="head" x="438" y="116" text-anchor="middle">Apply hub-spoke</text><text class="text" x="438" y="140" text-anchor="middle">mark cleanup</text><text class="text" x="438" y="159" text-anchor="middle">required first</text>
  <rect class="test" x="535" y="85" width="145" height="100" rx="10"/><text class="head" x="608" y="116" text-anchor="middle">Smoke + no drift</text><text class="text" x="608" y="140" text-anchor="middle">membership · goal</text><text class="text" x="608" y="159" text-anchor="middle">peerings · rules</text>
  <rect class="box" x="705" y="85" width="145" height="100" rx="10"/><text class="head" x="778" y="116" text-anchor="middle">Apply mesh</text><text class="text" x="778" y="140" text-anchor="middle">None, then same</text><text class="text" x="778" y="159" text-anchor="middle">name recreated</text>
  <rect class="test" x="875" y="85" width="145" height="100" rx="10"/><text class="head" x="948" y="116" text-anchor="middle">Smoke + no drift</text><text class="text" x="948" y="140" text-anchor="middle">fresh commit · IDs</text><text class="text" x="948" y="159" text-anchor="middle">mesh · no peerings</text>
  <path class="line" marker-end="url(#a)" d="M170 135h25M340 135h25M510 135h25M680 135h25M850 135h25"/>
  <path class="line" marker-end="url(#a)" d="M948 185v46H383v22"/><text class="text" x="695" y="223" text-anchor="middle">success or failure enters finally</text>
  <rect class="cleanup" x="255" y="254" width="255" height="75" rx="10"/><text class="head" x="383" y="282" text-anchor="middle">Undeploy all goal states</text><text class="text" x="383" y="305" text-anchor="middle">Terraform deletion · CLI empty fallback</text>
  <rect class="cleanup" x="540" y="254" width="220" height="75" rx="10"/><text class="head" x="650" y="282" text-anchor="middle">Full destroy</text><text class="text" x="650" y="305" text-anchor="middle">local state drives cleanup</text>
  <rect class="ok" x="790" y="254" width="340" height="75" rx="10"/><text class="head" x="960" y="282" text-anchor="middle">Prove no residue</text><text class="text" x="960" y="305" text-anchor="middle">state · RG · policy · routes · run tag</text>
  <path class="line" marker-end="url(#a)" d="M510 291h30M760 291h30"/>
</svg>
