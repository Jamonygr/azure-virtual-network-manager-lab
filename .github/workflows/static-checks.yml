name: Static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: 1.15.8
  TFLINT_VERSION: v0.63.1
  TRIVY_VERSION: v0.72.0
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/terraform-checks
        with:
          terraform-version: ${{ env.TF_VERSION }}

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init
      - run: tflint --recursive

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Scan Terraform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore.yaml
      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Scan Terraform
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          --workdir /workspace
          bridgecrew/checkov@sha256:51bebaca76536e985118a6af41ff4811a1b909a5e370492a955b4b6c82da6a88
          --directory .
          --config-file .checkov.yml
          --compact

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  conftest:
    name: Conftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Conftest
        shell: bash
        run: |
          set -euo pipefail
          archive=conftest_0.68.2_Linux_x86_64.tar.gz
          curl --fail --location --retry 5 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/$archive"
          echo "e8144c6d6d2ae0260b869caa60c7c262a1f95ac63ec1e5d2fb19be452d606347  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" conftest
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: conftest test tests/fixtures/plan-secure.json --policy policy --all-namespaces
      - name: Confirm insecure fixture is denied
        shell: bash
        run: |
          if conftest test tests/fixtures/plan-insecure.json --policy policy --all-namespaces; then
            echo "The intentionally insecure fixture was not denied." >&2
            exit 1
          fi

  pester:
    name: Pester lifecycle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - name: Run Pester
        shell: pwsh
        run: ./scripts/invoke-pester-tests.ps1

  go:
    name: Go repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tests/go.mod
          cache: false
      - run: go test -v -timeout 10m ./...
        working-directory: tests

  docs:
    name: Documentation and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install terraform-docs
        shell: bash
        run: |
          set -euo pipefail
          archive=terraform-docs-v0.24.0-linux-amd64.tar.gz
          curl --fail --location --retry 5 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/$archive"
          echo "9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" terraform-docs
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - shell: pwsh
        run: ./scripts/generate-terraform-docs.ps1 -Check
      - shell: pwsh
        run: ./scripts/test-markdown-links.ps1

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint
